worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format lb '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time up=$upstream_addr ut=$upstream_response_time';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;
    gzip_min_length 1024;

    # Docker DNS. nginx re-resolves the "api" name every 5 s, so it finds new and removed replicas.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream api {
        zone api 64k;
        least_conn;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default "";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        client_max_body_size 1m;

        # Common proxy settings for the API
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Overwrite (never append) the client address. The api uses it for the audit log only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Chat stream: no retry (a retry would repeat a GPU turn), no buffering, no gzip.
        location = /api/chat/stream {
            proxy_pass http://api;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 120s;
            add_header X-Accel-Buffering no always;
        }

        # Chat as JSON (the same turn as the stream): no retry, long read timeout
        location = /api/chat/ask {
            proxy_pass http://api;
            proxy_next_upstream off;
            proxy_read_timeout 120s;
        }

        # Exports stream CSV files
        location /api/export/ {
            proxy_pass http://api;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://api;
            # nginx retries only idempotent requests (GET, HEAD) on these errors.
            # A POST goes to another replica only when the connection to the first one failed.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        location = /lb/health {
            access_log off;
            return 200 "ok\n";
        }

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri $uri/ /index.html;
        }
    }
}
